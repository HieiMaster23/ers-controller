name: VHDL tests

on:
  push:
  pull_request:

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Rodar testbenches
        run: ./scripts/run_tests.sh

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghdl-logs
          path: build/ghdl/*.log

  cosim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar GHDL e dependencias Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          pip install -r cosim/requirements.txt

      - name: Co-simulacao VHDL + planta Python
        run: python cosim/run_cosim.py

      - name: Graficos
        if: always()
        run: python cosim/plot_results.py

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosim-results
          path: cosim/results/
